services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bybot:bybot@db:5432/bybot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bybot
      POSTGRES_USER: bybot
      POSTGRES_PASSWORD: bybot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bybot -d bybot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
